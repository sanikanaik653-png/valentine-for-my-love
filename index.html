<!DOCTYPE html>
<html>
<head>
<title>For My Love ❤️</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial;
    background: url('photo.jpg') no-repeat center center fixed;
    background-size: cover;
    text-align: center;
    color: white;
}

.container {
    background: rgba(0,0,0,0.6);
    padding: 30px;
    margin: 80px auto;
    width: 80%;
    max-width: 600px;
    border-radius: 15px;
}

h1 {
    color: #ff4d6d;
}

img {
    width: 250px;
    border-radius: 15px;
    margin-top: 10px;
}

p {
    font-size: 18px;
    line-height: 1.6;
}

</style>
</head>

<body>

<audio autoplay loop>
    <source src="ennasona.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <h1>To My Love ❤️</h1>

    <img src="photo.jpg" alt="Us">

    <p>
        You are the best thing that ever happened to me.  
        Every moment with you feels magical and special.  
        Thank you for being my happiness, my peace, and my forever.  
        I am so lucky to have you in my life.  
        I love you more than words can ever express.
    </p>

    <p>Forever Yours 💖</p>
</div>

</body>
</html>
