<!DOCTYPE html>
<html>
<head>
  <title>Happy Valentine’s Day ❤️</title>
  <style>
    body {
      background: linear-gradient(#ff758c, #ff7eb3);
      text-align: center;
      font-family: Arial, sans-serif;
      color: white;
      padding: 30px;
    }
    h1 {
      font-size: 2.5em;
    }
    p {
      font-size: 1.3em;
    }
    .heart {
      font-size: 4em;
      animation: beat 1s infinite;
    }
    @keyframes beat {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

<h1>Happy Valentine’s Day ❤️</h1>
<p>To my love, [Sahil] 💕</p>
<p>You are the reason I smile every day.</p>
<div class="heart">💖</div>
<p style="font-size:1.3em; color:white; margin-top:20px;">
“Fall in love with you more every single day.” ❤️
</p>
<img src="photo.jpg" alt="My Love" style="width:899px">
<!-- Enna Sona Official YouTube Video -->
<div style="margin-top:25px;">
  <iframe width="300" height="170"
    src="https://www.youtube.com/embed/wW70yO4RSJU"
    title="Enna Sona – OK Jaanu (Official Video)"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
  </iframe>
</div>
  
<p>Forever yours,</p>
<p><b>Sanika</b></p>

</body>
</html>
